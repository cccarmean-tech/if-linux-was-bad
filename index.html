const windows=new Map();let z=10;const $=s=>document.querySelector(s);
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),2200)}
const DB_NAME="linuxWasBadFiles",DB_STORE="downloads";
function openFileDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(DB_STORE,{keyPath:"id",autoIncrement:true});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveVirtualFile(name,blob){const db=await openFileDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).add({name,blob,size:blob.size,type:blob.type||"application/octet-stream",saved:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getVirtualFiles(){const db=await openFileDB();return new Promise((resolve,reject)=>{const req=db.transaction(DB_STORE).objectStore(DB_STORE).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function deleteVirtualFile(id){const db=await openFileDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function safeFilename(url){try{return decodeURIComponent(new URL(url).pathname.split("/").pop())||"download"}catch{return "download"}}
async function downloadToOS(url){let u;try{u=new URL(url);if(!["http:","https:"].includes(u.protocol))throw 0}catch{toast("Enter a valid direct download URL");return}toast("Downloading into OS storage…");try{const response=await fetch(u.href);if(!response.ok)throw new Error("HTTP "+response.status);const blob=await response.blob();if(!blob.size)throw new Error("Empty file");await saveVirtualFile(safeFilename(u.href),blob);toast("Saved "+safeFilename(u.href)+" to OS Downloads")}catch(e){toast("Site blocks in-browser downloads (CORS). Try a direct file link from a CORS-enabled host.")}}
function openInBrowser(url){let w=windows.get("browser");if(!w){openApp("browser");w=windows.get("browser")}w.style.display="flex";w.style.zIndex=++z;const address=w.querySelector("#browserAddress");const frame=w.querySelector("#browserFrame");if(address&&frame){address.value=url;frame.src=url}document.querySelectorAll(".task-app").forEach(x=>x.classList.remove("active"));w._task?.classList.add("active");}
function appContent(id){if(id==="files")return '<h2>File Manager</h2><p>Files saved here stay in this browser profile.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button class="action" id="refreshFiles">Refresh</button><label class="secondary" style="cursor:pointer">Import file <input id="importFile" type="file" multiple style="display:none"></label></div><h3 style="font-size:14px">📁 Downloads</h3><div id="virtualFiles"><p>Loading saved files…</p></div>';
if(id==="browser")return '<div class="browserbar"><input id="browserAddress" value="https://example.com" aria-label="Website address"><button class="action" id="browserGo">Go</button><button class="action" id="browserDownload">Download to OS</button><button class="secondary" id="browserExternal">Open tab ↗</button></div><iframe id="browserFrame" title="Website" src="https://example.com" style="width:100%;height:calc(100% - 55px);min-height:250px;border:0;border-radius:9px;background:white"></iframe><p style="font-size:11px;color:#aab4c5">Some websites block embedding. Use Open tab if a page does not appear.</p>';
if(id==="store")return '<h2>App Store</h2><p>Totally unofficial apps made for this fake OS. Their pretend installer packages download straight into your virtual Downloads folder.</p><div id="storeList"></div>';
if(id==="terminal")return '<div class="terminal" id="terminal"><div>Linux Was Bad OS [Version 1.0]</div><div>Type <b>help</b> to see available commands. Try: search steam, install godot, open github</div><div id="termOutput"></div><div><span style="color:#86efac">guest@linuxwasbad:~$ </span><input class="term-input" id="termInput" autofocus spellcheck="false" aria-label="Terminal command"></div></div>';
if(id==="settings")return '<h2>Settings</h2><p>Make this questionable desktop yours.</p><div class="setting-row"><div><b>Accent color</b><p>Change the system highlight.</p></div><input type="color" id="accentColor" value="#8b5cf6"></div><div class="setting-row"><div><b>Wallpaper</b><p>Pick a desktop background.</p></div><select id="wallpaper"><option value="purple">Purple / blue</option><option value="green">Matrix-ish green</option><option value="sunset">Sunset</option><option value="dark">Plain dark</option></select></div><div class="setting-row"><div><b>Sound effects</b><p>Just a little click sound.</p></div><input type="checkbox" id="sounds" checked></div><button class="secondary" id="resetSettings">Reset settings</button>';
if(id==="about")return '<div style="text-align:center;padding:15px"><div style="font-size:60px">🐧</div><h2>Linux Was Bad OS</h2><p>A browser-based fake operating system. Not actually Linux. Not actually an operating system. Definitely actually questionable.</p><p><b>Version:</b> 1.0<br><b>Session:</b> Guest<br><b>Kernel:</b> vibes-based</p><button class="action" id="aboutOk">Sounds good</button></div>';
if(id==="calculator")return '<h2>Calculator</h2><input id="calcDisplay" value="0" readonly style="width:100%;padding:12px;background:#0b1220;color:white;border:1px solid #ffffff30;border-radius:8px;text-align:right;font-size:24px;margin-bottom:10px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">'+["7","8","9","÷","4","5","6","×","1","2","3","−","0",".","C","+","="].map(k=>'<button class="secondary calcKey">'+k+'</button>').join("")+'</div>';
return '<p>App not found.</p>'}
function openApp(id){if(!apps[id])return;$("#startMenu").classList.remove("show");if(windows.has(id)){const w=windows.get(id);w.style.display="flex";w.style.zIndex=++z;return}
const w=document.createElement("section");w.className="window";w.style.zIndex=++z;w.innerHTML='<div class="titlebar"><strong>'+apps[id].icon+' '+apps[id].name+'</strong><div class="win-controls"><button data-min title="Minimize">—</button><button data-close title="Close">×</button></div></div><div class="window-body">'+appContent(id)+'</div>';$("#desktop").append(w);windows.set(id,w);

w.querySelector("[data-close]").onclick=()=>{w.remove();task.remove();windows.delete(id)};
w.querySelector("[data-min]").onclick=()=>w.style.display="none";
const bar=w.querySelector(".titlebar");let drag=null;bar.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;const r=w.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};bar.setPointerCapture(e.pointerId)});bar.addEventListener("pointermove",e=>{if(!drag)return;w.style.left=Math.max(5,Math.min(innerWidth-w.offsetWidth-5,e.clientX-drag.x))+"px";w.style.top=Math.max(5,Math.min(innerHeight-w.offsetHeight-55,e.clientY-drag.y))+"px";w.style.transform="none"});bar.addEventListener("pointerup",()=>drag=null);
wireApp(id,w);toast(apps[id].name+" opened");
}
function wireApp(id,w){const q=s=>w.querySelector(s);
if(id==="terminal"){const input=q("#termInput"),out=q("#termOutput");input.onkeydown=e=>{if(e.key!=="Enter")return;const cmd=input.value.trim();const line=document.createElement("div");line.className="term-line";line.textContent="guest@linuxwasbad:~$ "+cmd;out.append(line);const result=document.createElement("div");result.className="term-line";const [c,...args]=cmd.split(" ");const catalog={firefox:"https://www.mozilla.org/firefox/new/",steam:"https://store.steampowered.com/about/",godot:"https://godotengine.org/download/",blender:"https://www.blender.org/download/",gimp:"https://www.gimp.org/downloads/",vlc:"https://www.videolan.org/vlc/",github:"https://github.com/"};if(c==="search"){const term=(args.join(" ")||"").toLowerCase();const matches=Object.keys(catalog).filter(x=>x.includes(term));result.textContent=matches.length?"Apps: "+matches.join(", "):"No matching app. Try firefox, steam, godot, blender, gimp, vlc."}else if(c==="install"||c==="download"||c==="open"){const name=(args[0]||"").toLowerCase();if(catalog[name]){openInBrowser(catalog[name]);result.textContent="Opened official "+name+" page inside the OS browser. Review the download and install it yourself."}else result.textContent="Unknown app. Try: firefox, steam, godot, blender, gimp, vlc, github."}const commands={help:"Available: help, clear, whoami, date, uname, ls, neofetch, sudo, exit, search <app>, install <app>, download <app>, open <app>",whoami:"guest",date:new Date().toString(),uname:"LinuxWasBad 1.0 browser-kernel x86_64",ls:"Desktop  Documents  Downloads  Pictures  README.txt",neofetch:"OS: Linux Was Bad OS\nHost: Your browser\nKernel: vibes-based\nShell: pretend-bash",sudo:"guest is not in the sudoers file. This incident will be reported (to absolutely nobody).",exit:"There is no terminal to exit. You're already in the browser."};if(c==="clear"){out.innerHTML=""}else result.textContent=commands[c]??(cmd?"command not found: "+c:"");out.append(result);input.value="";q("#terminal").scrollTop=q("#terminal").scrollHeight};setTimeout(()=>input.focus(),80)}
if(id==="files"){const list=async()=>{const box=q("#virtualFiles");try{const files=await getVirtualFiles();box.innerHTML=files.length?files.map(f=>'<div class="file-row"><div style="min-width:0;flex:1"><b>'+escapeHtml(f.name)+'</b><div style="font-size:11px;color:#aab4c5">'+(f.size/1024).toFixed(1)+' KB · '+escapeHtml(f.type)+'</div></div><button class="secondary" data-save="'+f.id+'">Export</button><button class="secondary" data-delete="'+f.id+'">Delete</button></div>').join(""):"<p>Your Downloads folder is empty. Download a direct file URL from the Browser, or import a file.</p>";box.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const f=files.find(x=>x.id===Number(b.dataset.save));if(!f)return;const a=document.createElement("a"),u=URL.createObjectURL(f.blob);a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)});box.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{await deleteVirtualFile(Number(b.dataset.delete));list()})}catch{box.textContent="Could not open virtual storage."}};q("#refreshFiles").onclick=list;q("#importFile").onchange=async e=>{for(const f of e.target.files)await saveVirtualFile(f.name,f);e.target.value="";list();toast("Imported into OS Downloads")};list()}
if(id==="browser"){const navigate=()=>{let v=q("#browserAddress").value.trim();if(!/^https?:\/\//i.test(v))v="https://"+v;try{const u=new URL(v);if(!["http:","https:"].includes(u.protocol))throw 0;q("#browserAddress").value=u.href;q("#browserFrame").src=u.href}catch{toast("Enter a valid website address")}};q("#browserGo").onclick=navigate;q("#browserDownload").onclick=()=>downloadToOS(q("#browserAddress").value.trim());q("#browserAddress").onkeydown=e=>{if(e.key==="Enter")navigate()};q("#browserExternal").onclick=()=>{let v=q("#browserAddress").value.trim();if(!/^https?:\/\//i.test(v))v="https://"+v;try{const u=new URL(v);if(["http:","https:"].includes(u.protocol))window.open(u.href,"_blank","noopener,noreferrer");else toast("Only web addresses are allowed")}catch{toast("Enter a valid website address")}}}
if(id==="store"){const catalog=[{name:"Penguin Notes",desc:"A tiny pretend notes app",file:"penguin-notes.lwbadpkg",version:"1.0",content:"PENGUIN NOTES\\nA tiny notes app for Linux Was Bad OS.\\n\\nThis is a fictional package made for the simulator.\\nFeature list:\\n- Write notes\\n- Save ideas\\n- Look extremely official\\n"},{name:"Byte Player",desc:"A fictional music player package",file:"byte-player.lwbadpkg",version:"1.2",content:"BYTE PLAYER\\nVersion 1.2\\n\\nA pretend media player package for Linux Was Bad OS.\\nThis demo package does not install a real program.\\n"},{name:"Pixel Paint",desc:"A mini pixel-art starter kit",file:"pixel-paint.lwbadpkg",version:"0.9",content:"PIXEL PAINT STARTER KIT\\nPalette: #111827, #8b5cf6, #38bdf8, #f8fafc\\nCanvas size: 16 x 16\\n\\nFictional package for Linux Was Bad OS.\\n"},{name:"System Buddy",desc:"A fake system info utility",file:"system-buddy.lwbadpkg",version:"2.0",content:"SYSTEM BUDDY\\nVersion 2.0\\n\\nOS: Linux Was Bad OS\\nKernel: vibes-based\\nUser: guest\\nStatus: questionable but operational\\n"}];q("#storeList").innerHTML=catalog.map((a,i)=>'<div class="file-row"><div style="flex:1"><b>'+a.name+'</b><div style="font-size:12px;color:#aab4c5">'+a.desc+'</div><div style="font-size:11px;color:#8793a8">'+a.file+' · v'+a.version+'</div></div><button class="action" data-package="'+i+'">Download to OS</button></div>').join("");q("#storeList").querySelectorAll("[data-package]").forEach(b=>b.onclick=async()=>{const a=catalog[Number(b.dataset.package)];try{const data={package:a.name,version:a.version,format:"Linux Was Bad OS fictional package",notice:"This is pretend software for the browser-based OS simulator.",readme:a.content};await saveVirtualFile(a.file,new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));toast(a.name+" saved to OS Downloads")}catch{toast("Could not save package")}})}
if(id==="settings"){q("#accentColor").oninput=e=>document.documentElement.style.setProperty("--accent",e.target.value);q("#wallpaper").onchange=e=>{const b=$("#desktop");b.style.background=e.target.value==="green"?"radial-gradient(ellipse at 20% 20%,#14532d,transparent 45%),linear-gradient(135deg,#020617,#052e16)":e.target.value==="sunset"?"radial-gradient(ellipse at 70% 70%,#f97316,transparent 40%),linear-gradient(135deg,#312e81,#831843)":e.target.value==="dark"?"#111827":"radial-gradient(ellipse at 18% 20%,#4c1d95,transparent 35%),radial-gradient(ellipse at 82% 72%,#075985,transparent 38%),linear-gradient(135deg,#111827,#172554 55%,#111827)"};q("#resetSettings").onclick=()=>{document.documentElement.style.setProperty("--accent","#8b5cf6");q("#accentColor").value="#8b5cf6";q("#wallpaper").value="purple";q("#wallpaper").dispatchEvent(new Event("change"));toast("Settings reset")}}
if(id==="about")q("#aboutOk").onclick=()=>w.querySelector("[data-close]").click();
if(id==="calculator"){let expr="";const display=q("#calcDisplay");w.querySelectorAll(".calcKey").forEach(b=>b.onclick=()=>{const k=b.textContent;if(k==="C"){expr="";display.value="0";return}if(k==="="){try{if(!/^[0-9+*/.() -]+$/.test(expr))throw 0;const result=Function('"use strict";return ('+expr+')')();if(!Number.isFinite(result))throw 0;display.value=String(result);expr=String(result)}catch{display.value="Error";expr=""}return}expr+=({"÷":"/","×":"*","−":"-"}[k]||k);display.value=expr})}
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.querySelectorAll("[data-app]").forEach(b=>b.onclick=()=>openApp(b.dataset.app));
$("#startBtn").onclick=()=>$("#startMenu").classList.toggle("show");
function renderStart(filter=""){const grid=$("#startGrid");grid.innerHTML="";Object.entries(apps).filter(([id,a])=>(id+" "+a.name).toLowerCase().includes(filter.toLowerCase())).forEach(([id,a])=>{const b=document.createElement("button");b.className="start-item";b.innerHTML="<b>"+a.icon+"</b>"+a.name;b.onclick=()=>openApp(id);grid.append(b)})}
$("#appSearch").oninput=e=>renderStart(e.target.value);renderStart();document.addEventListener("pointerdown",e=>{if(!e.target.closest("#startMenu")&&!e.target.closest("#startBtn"))$("#startMenu").classList.remove("show")});
function tick(){const d=new Date();$("#clock").innerHTML=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+"<br>"+d.toLocaleDateString([],{month:"short",day:"numeric"})}tick();setInterval(tick,1000);
const volume=$("#volumeControl");volume.oninput=()=>{const n=Number(volume.value)/100;document.querySelectorAll("audio,video").forEach(m=>{try{m.volume=n}catch{}});$("#volumeValue").textContent=volume.value+"%";toast("OS media volume: "+volume.value+"%")};
</script>
</body>
</html>
