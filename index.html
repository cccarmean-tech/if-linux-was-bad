const DB_NAME="linuxWasBadFiles",DB_STORE="downloads";
function openFileDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(DB_STORE,{keyPath:"id",autoIncrement:true});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

if(id==="terminal"){const input=q("#termInput"),out=q("#termOutput");input.onkeydown=e=>{if(e.key!=="Enter")return;const cmd=input.value.trim();const line=document.createElement("div");line.className="term-line";line.textContent="guest@linuxwasbad:~$ "+cmd;out.append(line);const result=document.createElement("div");result.className="term-line";const [c,...args]=cmd.split(" ");const catalog={firefox:"https://www.mozilla.org/firefox/new/",steam:"https://store.steampowered.com/about/",godot:"https://godotengine.org/download/",blender:"https://www.blender.org/download/",gimp:"https://www.gimp.org/downloads/",vlc:"https://www.videolan.org/vlc/",github:"https://github.com/"};if(c==="search"){const term=(args.join(" ")||"").toLowerCase();const matches=Object.keys(catalog).filter(x=>x.includes(term));result.textContent=matches.length?"Apps: "+matches.join(", "):"No matching app. Try firefox, steam, godot, blender, gimp, vlc."}else if(c==="install"||c==="download"||c==="open"){const name=(args[0]||"").toLowerCase();if(catalog[name]){openInBrowser(catalog[name]);result.textContent="Opened official "+name+" page inside the OS browser. Review the download and install it yourself."}else result.textContent="Unknown app. Try: firefox, steam, godot, blender, gimp, vlc, github."}const commands={help:"Available: help, clear, whoami, date, uname, ls, neofetch, sudo, exit, search <app>, install <app>, download <app>, open <app>",whoami:"guest",date:new Date().toString(),uname:"LinuxWasBad 1.0 browser-kernel x86_64",ls:"Desktop  Documents  Downloads  Pictures  README.txt",neofetch:"OS: Linux Was Bad OS\nHost: Your browser\nKernel: vibes-based\nShell: pretend-bash",sudo:"guest is not in the sudoers file. This incident will be reported (to absolutely nobody).",exit:"There is no terminal to exit. You're already in the browser."};if(c==="clear"){out.innerHTML=""}else result.textContent=commands[c]??(cmd?"command not found: "+c:"");out.append(result);input.value="";q("#terminal").scrollTop=q if(id==="files"){const list=async()=>{const box=q("#virtualFiles");try{const files=await getVirtualFiles();box.innerHTML=files.length?files.map(f=>'<div class="file-row"><div style="min-width:0;flex:1"><b>'+escapeHtml(f.name)+'</b><div style="font-size:11px;color:#aab4c5">'+(f.size/1024).toFixed(1)+' KB · '+escapeHtml(f.type)+'</div></div><button class="action" data-open="'+f.id+'">Open</button><button class="secondary" data-save="'+f.id+'">Export to PC</button><button class="secondary" data-delete="'+f.id+'">Delete</button></div>').join(""):"<p>Your Downloads folder is empty. Download a direct file URL from the Browser, or import a file.</p>";box.querySelectorAll("[data-open]").forEach(b=>b.onclick=async()=>{const f=files.find(x=>x.id===Number(b.dataset.open));if(!f)return;let body;try{body=await f.blob.text()}catch{body="This file type cannot be previewed as text. Export it to your PC to open it with a compatible app."}const preview=document.createElement("div");preview.style.cssText="position:absolute;inset:42px 0 0;background:#111827;z-index:5;padding:16px;overflow:auto";preview.innerHTML='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><b style="flex:1">'+escapeHtml(f.name)+'</b><button class="secondary" id="closePreview">Close</button></div><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#080d16;padding:14px;border-radius:9px;color:#d1fae5;font:12px/1.6 ui-monospace,monospace"></pre>';preview.querySelector("pre").textContent=body;preview.querySelector("#closePreview").onclick=()=>preview.remove();w.append(preview)});box.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const f=files.find(x=>x.id===Number(b.dataset.save));if(!f)return;const a=document.createElement("a"),u=URL.createObjectURL(f.blob);a.href=u;a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);toast("Exported to your PC Downloads folder. You can open it from there.")});box.querySelectorAll if(id==="browser"){const navigate=()=>{let v=q("#browserAddress").value.trim();if(!/^https?:\/\//i.test(v))v="https://"+v;try{const u=new URL(v);if(!["http:","https:"].includes(u.protocol))throw 0;q("#browserAddress").value=u.href;q("#browserFrame").src=u.href}catch{toast("Enter a valid website address")}};q("#browserGo").onclick=navigate;q("#browserDownload").onclick=()=>downloadToOS(q("#browserAddress").value.trim());q("#browserAddress").onkeydown=e=>{if(e.key==="Enter")navigate()};q("#browserExternal").onclick=()=>{let v=q("#browserAddress").value.trim();if(!/^https?:\/\//i.test(v))v="https://"+v;try{const u=new URL(v);if(["http:","https:"].includes(u.protocol))window.open(u.href,"_blank","noopener,noreferrer");else toast("Only web addresses are allowed")}catch{toast("Enter a valid website address")}}}
if(id==="store"){const catalog=[{name:"Penguin Notes",desc:"A tiny pretend notes app",file:"penguin-notes.lwbadpkg",version:"1.0",content:"PENGUIN NOTES\\nA tiny notes app for Linux Was Bad OS.\\n\\nThis is a fictional package made for the simulator.\\nFeature list:\\n- Write notes\\n- Save ideas\\n- Look extremely official\\n"},{name:"Byte Player",desc:"A fictional music player package",file:"byte-player.lwbadpkg",version:"1.2",content:"BYTE PLAYER\\nVersion 1.2\\n\\nA pretend media player package for Linux Was Bad OS.\\nThis demo package does not install a real program.\\n"},{name:"Pixel Paint",desc:"A mini pixel-art starter kit",file:"pixel-paint.lwbadpkg",version:"0.9",content:"PIXEL PAINT STARTER KIT\\nPalette: #111827, #8b5cf6, #38bdf8, #f8fafc\\nCanvas size: 16 x 16\\n\\nFictional package for Linux Was Bad OS.\\n"},{name:"System Buddy",desc:"A fake system info utility",file:"system-buddy.lwbadpkg",version:"2.0",content:"SYSTEM BUDDY\\nVersion 2.0\\n\\nOS: Linux Was Bad OS\\nKernel: vibes-based\\nUser: guest\\nStatus: questionable but operational\\n"}];q("#storeList").innerHTML=catalog.map((a,i)=>'<div class="file-row"><div style="flex:1"><b>'+a.name+'</b><div style="font-size:12px;color:#aab4c5">'+a.desc+'</div><div style="font-size:11px;color:#8793a8">'+a.file+' · v'+a.version+'</div></div><button class="action" data-package="'+i+'">Download to OS</button></div>').join("");q("#storeList").querySelectorAll("[data-package]").forEach(b=>b.onclick=async()=>{const a=catalog[Number(b.dataset.package)];try{const data={package:a.name,version:a.version,format:"Linux Was Bad OS fictional package",notice:"This is pretend software for the browser-based OS simulator.",readme:a.content};await saveVirtualFile(a.file,new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));toast(a.name+" saved to OS Downloads")}catch{toast("Could not save package")}})}
if(id==="settings"){q("#accentColor").oninput=e=>document.documentElement.style.setProperty("--accent",e.target.value);q("#wallpaper").onchange=e=>{const b=$("#desktop");b.style.background=e.target.value==="green"?"radial-gradient(ellipse at 20% 20%,#14532d,transparent 45%),linear-gradient(135deg,#020617,#052e16)":e.target.value==="sunset"?"radial-gradient(ellipse at 70% 70%,#f97316,transparent 40%),linear-gradient(135deg,#312e81,#831843)":e.target.value==="dark"?"#111827":"radial-gradient(ellipse at 18% 20%,#4c1d95,transparent 35%),radial-gradient(ellipse at 82% 72%,#075985,transparent 38%),linear-gradient(135deg,#111827,#172554 55%,#111827)"};q("#resetSettings").onclick=()=>{document.documentElement.style.setProperty("--accent","#8b5cf6");q("#accentColor").value="#8b5cf6";q("#wallpaper").value="purple";q("#wallpaper").dispatchEvent(new Event("change"));toast("Settings reset")}}
if(id==="games"){const canvas=q("#gameCanvas"),ctx=canvas.getContext("2d"),info=q("#gameInfo"),help=q("#gameHelp");let mode="blocks",blocks=[],player={x:45,y:280,vx:0,vy:0,on:false},keys={},collected=0,monster={x:560,y:270},frame=0,raf=0;const W=640,H=360;function reset(){blocks=Array.from({length:20},(_,x)=>Array.from({length:9},(_,y)=>y>5?1:0));player={x:45,y:280,vx:0,vy:0,on:false};collected=0;monster={x:560,y:270};frame=0;draw()}function choose(m){mode=m;reset();if(m==="blocks"){info.textContent="BlockWorld — build a tiny block island";help.textContent="Click empty tiles to place blocks. Click filled tiles to remove them."}if(m==="obby"){info.textContent="BloxHop — reach the glowing goal";help.textContent="Move with A/D or ←/→. Jump with W, ↑, or Space. Avoid falling."}if(m==="night"){info.textContent="Night Shift — find all 3 keycards and reach the exit";help.textContent="Move with WASD or arrow keys. The shadow follows slowly. Find the yellow keycards."}w.querySelectorAll("[data-game]").forEach(b=>{b.className=b.dataset.game===m?"action":"secondary"})}function draw(){ctx.clearRect(0,0,W,H);if(mode==="blocks"){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#60a5fa");sky.addColorStop(1,"#dbeafe");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(let x=0;x<20;x++)for(let y=0;y<9;y++){if(blocks[x][y]){ctx.fillStyle=y===6?"#65a30d":y===7?"#854d0e":"#64748b";ctx.fillRect(x*32,y*32,31,31);ctx.strokeStyle="#ffffff35";ctx.strokeRect(x*32,y*32,31,31)}else{ctx.strokeStyle="#ffffff28";ctx.strokeRect(x*32,y*32,32,32)}}ctx.fillStyle="#14532d";ctx.fillRect(0,320,W,40);ctx.fillStyle="#fff";ctx.font="14px system-ui";ctx.fillText("BLOCKWORLD • MINI SANDBOX",14,22)}else if(mode==="obby"){ctx.fillStyle="#172554";ctx.fillRect(0,0,W,H);ctx.fillStyle="#38bdf8";ctx.fillRect(0,0,W,190);ctx.fillStyle="#fbbf24";ctx.fillRect(570,80,42,42);ctx.fillStyle="#fff";ctx.font="14px system-ui";ctx.fillText("REACH THE GOLD PLATFORM",14,24);const plats=[[0,325,130,35],[170,285,95,18],[300,235,95,18],[430,180,90,18],[555,122,85,18]];plats.forEach(p=>{ctx.fillStyle="#a78bfa";ctx.fillRect(...p);ctx.fillStyle="#ddd6fe";ctx.fillRect(p[0],p[1],p[2],5)});ctx.fillStyle="#f97316";ctx.fillRect(player.x,player.y,22,28);ctx.fillStyle="#111827";ctx.fillRect(player.x+5,player.y+7,4,4);ctx.fillRect(player.x+14,player.y+7,4,4);if(player.x>550&&player.y<130){ctx.fillStyle="#bbf7d0";ctx.font="bold 25px system-ui";ctx.fillText("YOU DID IT!",245,70)}if(player.y>H){ctx.fillStyle="#fecaca";ctx.font="bold 24px system-ui";ctx.fillText("FELL! Press Restart",205,170)}}else{ctx.fillStyle="#111827";ctx.fillRect(0,0,W,H);ctx.fillStyle="#1f2937";for(let x=10;x<W;x+=80)ctx.fillRect(x,0,4,H);for(let y=10;y<H;y+=70)ctx.fillRect(0,y,W,4);ctx.fillStyle="#334155";ctx.fillRect(65,65,510,230);ctx.fillStyle="#0f172a";ctx.fillRect(90,90,460,250);ctx.fillStyle="#facc15";[[150,130],[420,260],[500,130]].slice(collected).forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],8,0,Math.PI*2);ctx.fill()});ctx.fillStyle="#22c55e";ctx.fillRect(535,290,24,34);ctx.fillStyle="#f8fafc";ctx.font="13px system-ui";ctx.fillText("EXIT",530,285);ctx.fillStyle="#60a5fa";ctx.fillRect(player.x,player.y,20,20);ctx.fillStyle="#94a3b8";ctx.beginPath();ctx.arc(monster.x,monster.y,13,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="14px system-ui";ctx.fillText("KEYCARDS: "+collected+"/3",14,24);if(collected===3&&player.x>520&&player.y>270){ctx.fillStyle="#bbf7d0";ctx.font="bold 24px system-ui";ctx.fillText("EXIT UNLOCKED! YOU ESCAPED",145,180)}if(Math.hypot(player.x-monster.x,player.y-monster.y)<23){ctx.fillStyle="#fecaca";ctx.font="bold 22px system-ui";ctx.fillText("CAUGHT! Press Restart",190,180)}}}function tick(){if(mode==="obby"){player.vx=(keys.ArrowRight||keys.d?3:0)-(keys.ArrowLeft||keys.a?3:0);player.x=Math.max(0,Math.min(615,player.x+player.vx));player.vy+=.48;player.y+=player.vy;player.on=false;[[0,325,130,35],[170,285,95,18],[300,235,95,18],[430,180,90,18],[555,122,85,18]].forEach(p=>{if(player.x+22>p[0]&&player.x<p[0]+p[2]&&player.y+28>=p[1]&&player.y+28<=p[1]+12&&player.vy>=0){player.y=p[1]-28;player.vy=0;player.on=true}})}if(mode==="night"){const speed=2.5;player.x=Math.max(85,Math.min(540,player.x+((keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0))*speed));player.y=Math.max(90,Math.min(320,player.y+((keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0))*speed));const targets=[[150,130],[420,260],[500,130]];if(collected<3&&Math.hypot(player.x-targets[collected][0],player.y-targets[collected][1])<22)collected++;if(frame%3===0){monster.x+=Math.sign(player.x-monster.x)*.42;monster.y+=Math.sign(player.y-monster.y)*.42}}frame++;draw();raf=requestAnimationFrame(tick)}function start(){cancelAnimationFrame(raf);tick()}canvas.addEventListener("click",e=>{if(mode!=="blocks")return;const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*20),y=Math.floor((e.clientY-r.top)/r.height*9);if(x>=0&&x<20&&y>=0&&y<9)blocks[x][y]=blocks[x][y]?0:1;draw()});w.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys[e.key]=true;if(mode==="obby"&&(e.key===" "||e.key==="ArrowUp"||e.key==="w"||e.key==="W")&&player.on){player.vy=-10;player.on=false}});w.addEventListener("keyup",e=>keys[e.key]=false);w.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>{choose(b.dataset.game);start();canvas.focus()});q("#gameReset").onclick=()=>{reset();start();canvas.focus()};choose("blocks");start();w.addEventListener("pointerdown",()=>canvas.focus())}\nif(id==="about")q("#aboutOk").onclick=()=>w.querySelector("[data-close]").click();
if(id==="calculator"){let expr="";const display=q("#calcDisplay");w.querySelectorAll(".calcKey").forEach(b=>b.onclick=()=>{const k=b.textContent;if(k==="C"){expr="";display.value="0";return}if(k==="="){try{if(!/^[0-9+*/.() -]+$/.test(expr))throw 0;const result=Function('"use strict";return ('+expr+')')();if(!Number.isFinite(result))throw 0;display.value=String(result);expr=String(result)}catch{display.value="Error";expr=""}return}expr+=({"÷":"/","×":"*","−":"-"}[k]||k);display.value=expr})}
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

$("#startBtn").onclick=()=>$("#startMenu").classList.toggle("show");
function renderStart(filter=""){const grid=$("#startGrid");grid.innerHTML="";Object.entries(apps).filter(([id,a])=>(id+" "+a.name).toLowerCase().includes(filter.toLowerCase())).forEach(([id,a])=>{const b=document.createElement("button");b.className="start-item";b.innerHTML="<b>"+a.icon+"</b>"+a.name;b.onclick=()=>openApp(id);grid.append(b)})}
$("#appSearch").oninput=e=>renderStart(e.target.value);renderStart();document.addEventListener("pointerdown",e=>{if(!e.target.closest("#startMenu")&&!e.target.closest("#startBtn"))$("#startMenu").classList.remove("show")});
function tick(){const d=new Date();$("#clock").innerHTML=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+"<br>"+d.toLocaleDateString([],{month:"short",day:"numeric"})}tick();setInterval(tick,1000);
const volume=$("#volumeControl");volume.oninput=()=>{const n=Number(volume.value)/100;document.querySelectorAll("audio,video").forEach(m=>{try{m.volume=n}catch{}});$("#volumeValue").textContent=volume.value+"%";toast("OS media volume: "+volume.value+"%")};
